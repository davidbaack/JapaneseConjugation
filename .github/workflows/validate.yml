name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Stable, unique name used by main's required-status protection.
    name: Validate changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # No repository secrets or deployment permissions are exposed to PR code,
      # including Dependabot and fork pull requests. Deployment separately checks
      # the production-configured build after merging.
      - name: Validate formatting, lint, types, unit and browser tests, build, and budgets
        run: npm run ci
