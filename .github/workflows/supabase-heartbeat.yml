name: Supabase Heartbeat

on:
  workflow_dispatch:
  schedule:
    # Keep Katachiya's Free Supabase project active with a tiny read-only DB hit.
    # GitHub schedules use UTC; this runs Monday and Thursday at 10:37 UTC.
    - cron: '37 10 * * 1,4'

permissions: {}

jobs:
  heartbeat:
    name: Read public sentence row
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets are required."
            exit 1
          fi

      - name: Read one public sentence
        run: |
          set -euo pipefail

          response="$(mktemp)"
          status="$(
            curl --silent --show-error --location --fail-with-body \
              --retry 3 --retry-delay 5 --retry-connrefused \
              --output "$response" \
              --write-out "%{http_code}" \
              --get "$SUPABASE_URL/rest/v1/sentences" \
              --data-urlencode "select=word_key,type" \
              --data-urlencode "limit=1" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY"
          )"

          node -e '
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(rows)) {
              throw new Error("Expected Supabase REST response to be an array.");
            }
            console.log("Supabase heartbeat succeeded with HTTP " + process.argv[2] + " and " + rows.length + " row(s).");
          ' "$response" "$status"
