name: Supabase Heartbeat

on:
  workflow_dispatch:
  schedule:
    # Keep Katachiya's Free Supabase project active with tiny read-only DB hits.
    # GitHub schedules use UTC; this runs every day at 10:37 UTC.
    - cron: '37 10 * * *'

permissions: {}

jobs:
  heartbeat:
    name: Read public sentence row
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets are required."
            exit 1
          fi

      - name: Read three public sentences
        run: |
          set -euo pipefail

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          for offset in 0 1 2; do
            request="$((offset + 1))"
            status="$(
              curl --silent --show-error --location --fail-with-body \
                --retry 3 --retry-delay 5 --retry-connrefused \
                --output "$response" \
                --write-out "%{http_code}" \
                --get "$SUPABASE_URL/rest/v1/sentences" \
                --data-urlencode "select=word_key,type" \
                --data-urlencode "limit=1" \
                --data-urlencode "offset=$offset" \
                --header "apikey: $SUPABASE_ANON_KEY" \
                --header "Authorization: Bearer $SUPABASE_ANON_KEY"
            )"

            node -e '
              const fs = require("fs");
              const rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!Array.isArray(rows)) {
                throw new Error("Expected Supabase REST response to be an array.");
              }
              console.log("Supabase heartbeat request " + process.argv[3] + " succeeded with HTTP " + process.argv[2] + " and " + rows.length + " row(s).");
            ' "$response" "$status" "$request"
          done
